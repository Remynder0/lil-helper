<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer arcane arc with breathing glow -->
  <path d="M0 100 Q0 0, 100 0" stroke="#9a6abf" stroke-width="2" fill="none" opacity="0.85">
    <animate attributeName="stroke" values="#6b4c8a;#9a6abf;#6b4c8a" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M0 100 Q0 10, 90 0" stroke="#9a6abf" stroke-width="0.7" fill="none" opacity="0.4" stroke-dasharray="3 2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M0 90 Q10 0, 100 0" stroke="#c44569" stroke-width="0.7" fill="none" opacity="0.35" stroke-dasharray="2 3">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Inner mystical curves -->
  <path d="M0 60 Q15 15, 60 0" stroke="#9a6abf" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M0 35 Q12 12, 35 0" stroke="#8b3a3a" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Crescent moon in corner with breathing light -->
  <path d="M12 12 A10 10 0 1 1 12 32 A7 7 0 1 0 12 12" fill="#9a6abf" opacity="0.6">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.5s" repeatCount="indefinite" />
  </path>

  <!-- Small stars along the arc with twinkling -->
  <g fill="#9a6abf">
    <polygon points="45,8 46.2,11 49.5,11.5 47,13.5 47.8,17 45,15 42.2,17 43,13.5 40.5,11.5 43.8,11" transform="scale(0.6) translate(50,5)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="45,8 46.2,11 49.5,11.5 47,13.5 47.8,17 45,15 42.2,17 43,13.5 40.5,11.5 43.8,11" transform="scale(0.45) translate(10,85)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Arcane node dots -->
  <circle cx="8" cy="8" r="3" fill="#9a6abf" opacity="0.4">
    <animate attributeName="r" values="2.5;3.8;2.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="8" cy="8" r="1.5" fill="#c44569" opacity="0.8"/>
  <circle cx="35" cy="35" r="1.3" fill="#9a6abf" opacity="0.5"/>
  <circle cx="55" cy="12" r="1.2" fill="#9a6abf" opacity="0.4"/>
  <circle cx="12" cy="55" r="1.2" fill="#8b3a3a" opacity="0.4"/>

  <!-- Tiny ritual cross -->
  <g stroke="#c44569" stroke-width="0.9" opacity="0.5">
    <line x1="22" y1="18" x2="22" y2="26"/>
    <line x1="18" y1="22" x2="26" y2="22"/>
  </g>
</svg>
