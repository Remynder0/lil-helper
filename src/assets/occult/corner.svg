<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer arcane arc -->
  <path d="M0 100 Q0 0, 100 0" stroke="#6b4c8a" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M0 100 Q0 10, 90 0" stroke="#6b4c8a" stroke-width="0.7" fill="none" opacity="0.35" stroke-dasharray="3 2"/>
  <path d="M0 90 Q10 0, 100 0" stroke="#8b3a3a" stroke-width="0.7" fill="none" opacity="0.3" stroke-dasharray="2 3"/>
  <!-- Inner mystical curves -->
  <path d="M0 60 Q15 15, 60 0" stroke="#6b4c8a" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M0 35 Q12 12, 35 0" stroke="#8b3a3a" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Crescent moon in corner -->
  <path d="M12 12 A10 10 0 1 1 12 32 A7 7 0 1 0 12 12" fill="#6b4c8a" opacity="0.5"/>
  <!-- Small stars along the arc -->
  <g fill="#6b4c8a" opacity="0.6">
    <polygon points="45,8 46.2,11 49.5,11.5 47,13.5 47.8,17 45,15 42.2,17 43,13.5 40.5,11.5 43.8,11" transform="scale(0.6) translate(50,5)"/>
    <polygon points="45,8 46.2,11 49.5,11.5 47,13.5 47.8,17 45,15 42.2,17 43,13.5 40.5,11.5 43.8,11" transform="scale(0.45) translate(10,85)"/>
  </g>
  <!-- Arcane node dots -->
  <circle cx="8" cy="8" r="3" fill="#6b4c8a" opacity="0.3"/>
  <circle cx="8" cy="8" r="1.5" fill="#8b3a3a" opacity="0.6"/>
  <circle cx="35" cy="35" r="1.2" fill="#6b4c8a" opacity="0.4"/>
  <circle cx="55" cy="12" r="1" fill="#6b4c8a" opacity="0.3"/>
  <circle cx="12" cy="55" r="1" fill="#8b3a3a" opacity="0.3"/>
  <!-- Tiny ritual cross -->
  <g stroke="#8b3a3a" stroke-width="0.8" opacity="0.4">
    <line x1="22" y1="18" x2="22" y2="26"/>
    <line x1="18" y1="22" x2="26" y2="22"/>
  </g>
</svg>
