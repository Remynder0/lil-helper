<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <defs>
    <linearGradient id="ocd-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4c8a" stop-opacity="0"/>
      <stop offset="35%" stop-color="#6b4c8a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b3a3a"/>
      <stop offset="65%" stop-color="#6b4c8a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6b4c8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ocd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6b4c8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6b4c8a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Main ritual line -->
  <line x1="30" y1="20" x2="370" y2="20" stroke="url(#ocd-g)" stroke-width="1"/>
  <!-- Dashed arcane parallels -->
  <line x1="60" y1="16" x2="340" y2="16" stroke="#6b4c8a" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 3"/>
  <line x1="60" y1="24" x2="340" y2="24" stroke="#6b4c8a" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 3"/>
  <!-- Center glow -->
  <circle cx="200" cy="20" r="18" fill="url(#ocd-glow)"/>
  <!-- Central rotated diamond seal -->
  <rect x="193" y="13" width="14" height="14" rx="1" transform="rotate(45 200 20)" stroke="#6b4c8a" stroke-width="1.5" fill="#110f0c"/>
  <circle cx="200" cy="20" r="3.5" fill="#8b3a3a" opacity="0.7"/>
  <circle cx="200" cy="20" r="1.5" fill="#6b4c8a"/>
  <!-- Flanking crescents -->
  <path d="M170 20 A6 6 0 1 1 170 21" stroke="#6b4c8a" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M172 20 A4 4 0 1 0 172 21" stroke="#110f0c" stroke-width="1.5" fill="none"/>
  <path d="M230 20 A6 6 0 1 1 230 21" stroke="#6b4c8a" stroke-width="0.8" fill="none" opacity="0.5" transform="scale(-1,1) translate(-400,0)"/>
  <path d="M228 20 A4 4 0 1 0 228 21" stroke="#110f0c" stroke-width="1.5" fill="none" transform="scale(-1,1) translate(-400,0)"/>
  <!-- Small stars -->
  <circle cx="150" cy="20" r="1.2" fill="#6b4c8a" opacity="0.5"/>
  <circle cx="250" cy="20" r="1.2" fill="#6b4c8a" opacity="0.5"/>
  <circle cx="120" cy="20" r="0.8" fill="#8b3a3a" opacity="0.35"/>
  <circle cx="280" cy="20" r="0.8" fill="#8b3a3a" opacity="0.35"/>
  <!-- Endpoint trinities -->
  <g fill="#6b4c8a" opacity="0.3">
    <circle cx="45" cy="18" r="1"/>
    <circle cx="45" cy="22" r="1"/>
    <circle cx="40" cy="20" r="1"/>
    <circle cx="355" cy="18" r="1"/>
    <circle cx="355" cy="22" r="1"/>
    <circle cx="360" cy="20" r="1"/>
  </g>
</svg>
