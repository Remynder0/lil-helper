<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <defs>
    <linearGradient id="ocd-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4c8a" stop-opacity="0"/>
      <stop offset="35%" stop-color="#6b4c8a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b3a3a"/>
      <stop offset="65%" stop-color="#6b4c8a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6b4c8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ocd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a6abf" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6b4c8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6b4c8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main ritual line -->
  <line x1="30" y1="20" x2="370" y2="20" stroke="url(#ocd-g)" stroke-width="1.2"/>

  <!-- Dashed arcane parallels with gentle breathing opacity -->
  <line x1="60" y1="16" x2="340" y2="16" stroke="#9a6abf" stroke-width="0.6" opacity="0.4" stroke-dasharray="4 3">
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="4s" repeatCount="indefinite" />
  </line>
  <line x1="60" y1="24" x2="340" y2="24" stroke="#9a6abf" stroke-width="0.6" opacity="0.4" stroke-dasharray="4 3">
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Center pulsating arcane glow -->
  <circle cx="200" cy="20" r="18" fill="url(#ocd-glow)">
    <animate attributeName="r" values="14;24;14" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Central rotated diamond seal -->
  <rect x="193" y="13" width="14" height="14" rx="1" transform="rotate(45 200 20)" stroke="#9a6abf" stroke-width="1.5" fill="#130d1e"/>
  
  <!-- Central crimson core -->
  <circle cx="200" cy="20" r="3.5" fill="#c44569" opacity="0.8">
    <animate attributeName="r" values="2.8;4.2;2.8" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="20" r="1.5" fill="#e9d5ff">
    <animate attributeName="fill" values="#9a6abf;#ffffff;#9a6abf" dur="2.2s" repeatCount="indefinite" />
  </circle>

  <!-- Flanking crescents -->
  <path d="M170 20 A6 6 0 1 1 170 21" stroke="#9a6abf" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M172 20 A4 4 0 1 0 172 21" stroke="#130d1e" stroke-width="1.5" fill="none"/>
  <path d="M230 20 A6 6 0 1 1 230 21" stroke="#9a6abf" stroke-width="0.8" fill="none" opacity="0.6" transform="scale(-1,1) translate(-400,0)"/>
  <path d="M228 20 A4 4 0 1 0 228 21" stroke="#130d1e" stroke-width="1.5" fill="none" transform="scale(-1,1) translate(-400,0)"/>

  <!-- Small stars with staggered twinkling -->
  <circle cx="150" cy="20" r="1.3" fill="#9a6abf">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="20" r="1.3" fill="#9a6abf">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="120" cy="20" r="1" fill="#c44569">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="280" cy="20" r="1" fill="#c44569">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" repeatCount="indefinite" />
  </circle>

  <!-- Endpoint trinities -->
  <g fill="#9a6abf" opacity="0.4">
    <circle cx="45" cy="18" r="1"/>
    <circle cx="45" cy="22" r="1"/>
    <circle cx="40" cy="20" r="1"/>
    <circle cx="355" cy="18" r="1"/>
    <circle cx="355" cy="22" r="1"/>
    <circle cx="360" cy="20" r="1"/>
  </g>
</svg>
