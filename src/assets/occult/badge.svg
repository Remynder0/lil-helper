<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="ocb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6b4c8a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6b4c8a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ambient glow -->
  <circle cx="50" cy="50" r="48" fill="url(#ocb-glow)"/>
  <!-- Outer circle with dashes -->
  <circle cx="50" cy="50" r="44" stroke="#6b4c8a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="36" stroke="#6b4c8a" stroke-width="1" opacity="0.7"/>
  <!-- Pentagram star -->
  <polygon points="50,10 61.8,72.4 9.5,31.4 90.5,31.4 38.2,72.4" stroke="#8b3a3a" stroke-width="1.2" fill="none" opacity="0.7"/>
  <!-- Inscribed circle in pentagram -->
  <circle cx="50" cy="44" r="15" stroke="#6b4c8a" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Cardinal node dots on outer ring -->
  <circle cx="50" cy="6" r="2" fill="#6b4c8a" opacity="0.6"/>
  <circle cx="50" cy="94" r="2" fill="#6b4c8a" opacity="0.6"/>
  <circle cx="6" cy="50" r="2" fill="#8b3a3a" opacity="0.5"/>
  <circle cx="94" cy="50" r="2" fill="#8b3a3a" opacity="0.5"/>
  <!-- Diagonal cardinal dots -->
  <circle cx="19" cy="19" r="1.3" fill="#6b4c8a" opacity="0.35"/>
  <circle cx="81" cy="19" r="1.3" fill="#6b4c8a" opacity="0.35"/>
  <circle cx="19" cy="81" r="1.3" fill="#6b4c8a" opacity="0.35"/>
  <circle cx="81" cy="81" r="1.3" fill="#6b4c8a" opacity="0.35"/>
  <!-- Central eye -->
  <ellipse cx="50" cy="44" rx="8" ry="5" stroke="#8b3a3a" stroke-width="1" fill="#110f0c"/>
  <circle cx="50" cy="44" r="3" fill="#6b4c8a" opacity="0.6"/>
  <circle cx="50" cy="44" r="1.2" fill="#8b3a3a"/>
  <!-- Cross hairs through center -->
  <line x1="50" y1="36" x2="50" y2="52" stroke="#6b4c8a" stroke-width="0.4" opacity="0.3"/>
  <line x1="40" y1="44" x2="60" y2="44" stroke="#6b4c8a" stroke-width="0.4" opacity="0.3"/>
</svg>
