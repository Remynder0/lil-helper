<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vmc-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a7e6b"/>
      <stop offset="50%" stop-color="#5a4e3c"/>
      <stop offset="100%" stop-color="#3d3428"/>
    </linearGradient>
    <radialGradient id="vmc-rivet" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#e8c06a"/>
      <stop offset="45%" stop-color="#b87333"/>
      <stop offset="100%" stop-color="#3d3428"/>
    </radialGradient>
  </defs>
  <!-- Heavy iron L-bracket -->
  <path d="M0 0 H55 V8 H8 V55 H0 Z" fill="url(#vmc-iron)"/>
  <!-- Highlight edge (top/left bevel) -->
  <line x1="0" y1="0" x2="55" y2="0" stroke="#8a7e6b" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="55" stroke="#8a7e6b" stroke-width="1" opacity="0.6"/>
  <!-- Shadow edge (inner bevel) -->
  <line x1="8" y1="8" x2="55" y2="8" stroke="#15120f" stroke-width="0.8" opacity="0.7"/>
  <line x1="8" y1="8" x2="8" y2="55" stroke="#15120f" stroke-width="0.8" opacity="0.7"/>
  <!-- Rivets along horizontal arm -->
  <circle cx="14" cy="4" r="2.5" fill="url(#vmc-rivet)"/>
  <circle cx="26" cy="4" r="2.5" fill="url(#vmc-rivet)"/>
  <circle cx="38" cy="4" r="2.5" fill="url(#vmc-rivet)"/>
  <circle cx="50" cy="4" r="2.5" fill="url(#vmc-rivet)"/>
  <!-- Rivets along vertical arm -->
  <circle cx="4" cy="14" r="2.5" fill="url(#vmc-rivet)"/>
  <circle cx="4" cy="26" r="2.5" fill="url(#vmc-rivet)"/>
  <circle cx="4" cy="38" r="2.5" fill="url(#vmc-rivet)"/>
  <circle cx="4" cy="50" r="2.5" fill="url(#vmc-rivet)"/>
  <!-- Corner reinforcement gusset plate -->
  <path d="M8 35 L8 8 L35 8" stroke="#5a4e3c" stroke-width="1.5" fill="none"/>
  <path d="M8 28 L8 8 L28 8" fill="#3d3428" opacity="0.4"/>
  <!-- Gusset diagonal brace -->
  <line x1="8" y1="32" x2="32" y2="8" stroke="#8a7e6b" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="24" x2="24" y2="8" stroke="#5a4e3c" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner rivet (large) -->
  <circle cx="4" cy="4" r="3" fill="url(#vmc-rivet)"/>
  <circle cx="4" cy="4" r="1" fill="#15120f" opacity="0.4"/>
</svg>
