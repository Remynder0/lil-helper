<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" fill="none">
  <defs>
    <linearGradient id="vmp-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7e6b"/>
      <stop offset="20%" stop-color="#5a4e3c"/>
      <stop offset="80%" stop-color="#3d3428"/>
      <stop offset="100%" stop-color="#1c1712"/>
    </linearGradient>
    <linearGradient id="vmp-bevel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7e6b"/>
      <stop offset="50%" stop-color="#5a4e3c"/>
      <stop offset="100%" stop-color="#3d3428"/>
    </linearGradient>
    <radialGradient id="vmp-rivet" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#e8c06a"/>
      <stop offset="50%" stop-color="#b87333"/>
      <stop offset="100%" stop-color="#3d3428"/>
    </radialGradient>
  </defs>

  <!-- Heavy Cast-Iron Plate with chamfered corners -->
  <polygon points="10,4 150,4 156,10 156,40 150,46 10,46 4,40 4,10" 
           fill="url(#vmp-iron)" 
           stroke="#3d3428" 
           stroke-width="1.5"/>

  <!-- Outer Bevel Highlights -->
  <line x1="10" y1="4" x2="150" y2="4" stroke="#8a7e6b" stroke-width="1" opacity="0.8"/>
  <line x1="4" y1="10" x2="4" y2="40" stroke="#8a7e6b" stroke-width="1" opacity="0.8"/>
  <!-- Inner shadow lines -->
  <line x1="10" y1="46" x2="150" y2="46" stroke="#15120e" stroke-width="1.2"/>
  <line x1="156" y1="10" x2="156" y2="40" stroke="#15120e" stroke-width="1.2"/>

  <!-- Recessed Inner Panel -->
  <polygon points="14,8 146,8 151,13 151,37 146,42 14,42 9,37 9,13" 
           fill="#1f1a14" 
           stroke="#5a4e3c" 
           stroke-width="1"/>

  <!-- Corner Clustered Rivets -->
  <!-- Top Left -->
  <circle cx="8" cy="8" r="2" fill="url(#vmp-rivet)"/>
  <!-- Top Right -->
  <circle cx="152" cy="8" r="2" fill="url(#vmp-rivet)"/>
  <!-- Bottom Left -->
  <circle cx="8" cy="42" r="2" fill="url(#vmp-rivet)"/>
  <!-- Bottom Right -->
  <circle cx="152" cy="42" r="2" fill="url(#vmp-rivet)"/>

  <!-- Perimeter Rivets along Top and Bottom rails -->
  <circle cx="35" cy="6" r="1.5" fill="url(#vmp-rivet)"/>
  <circle cx="65" cy="6" r="1.5" fill="url(#vmp-rivet)"/>
  <circle cx="95" cy="6" r="1.5" fill="url(#vmp-rivet)"/>
  <circle cx="125" cy="6" r="1.5" fill="url(#vmp-rivet)"/>

  <circle cx="35" cy="44" r="1.5" fill="url(#vmp-rivet)"/>
  <circle cx="65" cy="44" r="1.5" fill="url(#vmp-rivet)"/>
  <circle cx="95" cy="44" r="1.5" fill="url(#vmp-rivet)"/>
  <circle cx="125" cy="44" r="1.5" fill="url(#vmp-rivet)"/>

  <!-- Central Victorian Inlaid Cartouche Border -->
  <rect x="24" y="13" width="112" height="24" rx="2" fill="none" stroke="#5a4e3c" stroke-width="0.8"/>
  <rect x="26" y="15" width="108" height="20" rx="1" fill="none" stroke="#8a7e6b" stroke-width="0.5" opacity="0.5"/>

  <!-- Flanking Industrial Decorative Screws on Cartouche -->
  <circle cx="28" cy="25" r="1.6" fill="url(#vmp-rivet)"/>
  <line x1="26.8" y1="25" x2="29.2" y2="25" stroke="#15120e" stroke-width="0.6"/>

  <circle cx="132" cy="25" r="1.6" fill="url(#vmp-rivet)"/>
  <line x1="130.8" y1="25" x2="133.2" y2="25" stroke="#15120e" stroke-width="0.6"/>
</svg>
