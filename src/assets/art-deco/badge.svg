<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="adb-g" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8c06a"/>
      <stop offset="100%" stop-color="#b87333"/>
    </linearGradient>
  </defs>
  <!-- Radiating rays (12 rays) -->
  <g stroke="#e8c06a" stroke-width="0.8" opacity="0.4">
    <line x1="50" y1="50" x2="50" y2="4"/>
    <line x1="50" y1="50" x2="73" y2="10"/>
    <line x1="50" y1="50" x2="90" y2="27"/>
    <line x1="50" y1="50" x2="96" y2="50"/>
    <line x1="50" y1="50" x2="90" y2="73"/>
    <line x1="50" y1="50" x2="73" y2="90"/>
    <line x1="50" y1="50" x2="50" y2="96"/>
    <line x1="50" y1="50" x2="27" y2="90"/>
    <line x1="50" y1="50" x2="10" y2="73"/>
    <line x1="50" y1="50" x2="4" y2="50"/>
    <line x1="50" y1="50" x2="10" y2="27"/>
    <line x1="50" y1="50" x2="27" y2="10"/>
  </g>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="42" stroke="#b87333" stroke-width="2"/>
  <circle cx="50" cy="50" r="39" stroke="#e8c06a" stroke-width="0.5" opacity="0.5"/>
  <!-- Mid ring with tick marks -->
  <circle cx="50" cy="50" r="30" stroke="#c4956a" stroke-width="1"/>
  <!-- 8 tick marks on mid ring -->
  <g stroke="#e8c06a" stroke-width="1">
    <line x1="50" y1="17" x2="50" y2="22"/>
    <line x1="50" y1="78" x2="50" y2="83"/>
    <line x1="17" y1="50" x2="22" y2="50"/>
    <line x1="78" y1="50" x2="83" y2="50"/>
    <line x1="27" y1="27" x2="30.5" y2="30.5"/>
    <line x1="73" y1="27" x2="69.5" y2="30.5"/>
    <line x1="27" y1="73" x2="30.5" y2="69.5"/>
    <line x1="73" y1="73" x2="69.5" y2="69.5"/>
  </g>
  <!-- Inner stepped octagon -->
  <polygon points="50,24 68,32 76,50 68,68 50,76 32,68 24,50 32,32" stroke="#b87333" stroke-width="1.2" fill="none"/>
  <!-- Center diamond -->
  <polygon points="50,38 62,50 50,62 38,50" fill="url(#adb-g)" opacity="0.7"/>
  <polygon points="50,38 62,50 50,62 38,50" stroke="#e8c06a" stroke-width="0.8" fill="none"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#e8c06a"/>
  <circle cx="50" cy="50" r="1.5" fill="#15120f"/>
</svg>
