  <!-- Outer stepped frame -->
  <path d="M0 0 H50 V3 H3 V50 H0 Z" fill="url(#adc-g)" opacity="0.9"/>
  <path d="M0 0 H70 V1.5 H1.5 V70 H0 Z" fill="#c4956a" opacity="0.4"/>
