  <polyline points="22,0 22,8 0,8" stroke="#e8c06a" stroke-width="1.5" fill="none"/>
  <polyline points="36,0 36,16 0,16" stroke="#b87333" stroke-width="1.2" fill="none"/>
  <polyline points="48,0 48,24 0,24" stroke="#c4956a" stroke-width="1" fill="none" opacity="0.7"/>
  <polyline points="58,0 58,32 0,32" stroke="#c4956a" stroke-width="0.7" fill="none" opacity="0.4"/>
  <!-- Diagonal fan rays -->
  <line x1="0" y1="0" x2="90" y2="15" stroke="#e8c06a" stroke-width="0.6" opacity="0.35"/>
  <line x1="0" y1="0" x2="78" y2="32" stroke="#e8c06a" stroke-width="0.7" opacity="0.4"/>
  <line x1="0" y1="0" x2="58" y2="58" stroke="#b87333" stroke-width="0.9" opacity="0.5"/>
  <line x1="0" y1="0" x2="32" y2="78" stroke="#e8c06a" stroke-width="0.7" opacity="0.4"/>
  <line x1="0" y1="0" x2="15" y2="90" stroke="#e8c06a" stroke-width="0.6" opacity="0.35"/>
